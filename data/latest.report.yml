{"id":435131642,"author":{"login":"wolo-lab","id":274205925,"node_id":"U_kgDOEFgM5Q","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOOk6zdc4Z75T6","tag_name":"plugin/agentanalytics/v0.1.0","target_commitish":"e342d2f6c7493bdc373190518c726d5d5228359d","name":"plugin/agentanalytics v0.1.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-04T22:07:35Z","updated_at":"2026-11-05T11:47:38Z","published_at":"2026-11-05T11:47:38Z","assets":[],"body":"The first release of the BigQuery Agent Analytics plugin for ADK Go. It logs every agent run to a BigQuery table, so you can query and dashboard agent behavior with SQL: invocations, model requests and responses, tool calls, state changes, agent transfers and human-in-the-loop requests.\r\n\r\nThe table schema, event type names and analytics views match adk-python's BigQuery Agent Analytics plugin, so Go and Python agents can write to the same table and be queried together.\r\n\r\n## Install\r\n\r\n```bash\r\ngo get google.golang.org/adk/plugin/agentanalytics@v0.1.0\r\n```\r\n\r\nRequires `google.golang.org/adk/v2` v2.0.0 or later.\r\n\r\n## Quick start\r\n\r\n```go\r\nanalytics, err := agentanalytics.NewBigQueryAgentAnalyticsPlugin(ctx, \"my-project\", \"agent_analytics\", \"agent_events\")\r\nif err != nil {\r\n\tlog.Fatal(err)\r\n}\r\ndefer analytics.Close() // flushes queued rows to BigQuery\r\n\r\nr, err := runner.New(runner.Config{\r\n\tAppName:        \"my-app\",\r\n\tAgent:          myAgent,\r\n\tSessionService: session.InMemoryService(),\r\n\tPluginConfig:   runner.PluginConfig{Plugins: []*plugin.Plugin{analytics}},\r\n})\r\n```\r\n\r\nCall `Close` before the process exits, so that rows still in the queue are written.\r\n\r\n## What's included\r\n\r\n- **Ready to query out of the box.** The plugin creates the events table if it is missing, adds new columns to an existing table, and creates 25 per-event views such as `v_llm_request` and `v_tool_completed`.\r\n- **Batched, non-blocking writes** through the BigQuery Storage Write API, 100 rows or 1 second per batch by default. Batches over 8 MiB are split so that a single large batch is not rejected as a whole.\r\n- **Redaction on by default.** Values under keys like `api_key`, `password` and `token`, credentials in URLs, and `Authorization`, `Bearer` and `Basic` credentials are replaced with `[REDACTED]`. Text values longer than 512,000 characters are truncated unless `CaptureFullMessageContent` is set.\r\n- **Control over what is logged:** event allow and deny lists, a payload column deny list, a `ContentFormatter` hook to transform or redact payloads before they are written, custom tags, and an allow list for `CustomMetadata` keys.\r\n- **Cloud Storage offload** (optional). Set `GCSBucketName` to store large text and binary parts in a bucket and keep a reference in the row.\r\n- **Exactly-once delivery** (optional). `ExactlyOnceDelivery` writes through a committed stream with explicit offsets, so retries do not write rows twice.\r\n- **Drop counters.** `DropStats` reports rows lost to a full queue, failed writes or shutdown.\r\n- **OpenTelemetry correlation** (optional). `EnableOTelCorrelation` adds the current trace and span IDs to each row.\r\n\r\nSee the [package documentation](https://pkg.go.dev/google.golang.org/adk/plugin/agentanalytics) for every option.\r\n\r\n## Before you use it\r\n\r\n- **This is a pre-1.0 release.** The exported API may still change before v1.0.0, including helpers such as `BatchProcessor`, `FormatContentParts`, `SmartTruncate` and `ArrowSchema`. The path to v1.0.0 is tracked in #2014.\r\n- **Register it before plugins that replace results.** ADK stops at the first plugin callback that returns a replacement event, model response or tool result, so the analytics plugin does not see what an earlier plugin replaced.\r\n- **Known differences from adk-python** are listed in #2046 and #2047. For example, when a callback recovers a failed tool call, Go logs `TOOL_ERROR` followed by `TOOL_COMPLETED`, while Python logs only `TOOL_ERROR`.\r\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0}}
